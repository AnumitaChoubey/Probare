version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qems-postgres
    environment:
      POSTGRES_USER: qems_user
      POSTGRES_PASSWORD: qems_password
      POSTGRES_DB: qems_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qems_user -d qems_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-postgres:
    image: postgres:16-alpine
    container_name: qems-test-postgres
    environment:
      POSTGRES_USER: qems_test_user
      POSTGRES_PASSWORD: qems_test_password
      POSTGRES_DB: qems_test_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qems_test_user -d qems_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qems-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: qems-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: qems-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - APPLICATION_ENV=development
      - DATABASE_URL=postgresql+asyncpg://qems_user:qems_password@postgres:5432/qems_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=qems-evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
