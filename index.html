<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Enterprise quality operations platform to detect, document, review, dispute, resolve, investigate, and prevent recurring quality errors." />

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('qems_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-indigo-100 dark:selection:bg-indigo-900 selection:text-indigo-900 dark:selection:text-indigo-100">

    <script type="module" src="/src/main.tsx"></script>
  </body>
